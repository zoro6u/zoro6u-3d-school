# Render Blueprint for the API. The frontend goes on Vercel or Netlify (see docs/deploy.md).
services:
  - type: web
    name: 3d-school-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste it in the Render dashboard; never commit it
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5 # claude-haiku-5-5 is the cheaper option for a public demo
      - key: ANTHROPIC_EFFORT
        value: low
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
