name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --frozen
        working-directory: api
      - name: Lint
        run: uv run ruff check .
        working-directory: api
      - name: Test
        run: uv run pytest -q
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Typecheck
        run: pnpm typecheck
        working-directory: web
      - name: Test
        run: pnpm test
        working-directory: web
      - name: Build
        run: pnpm build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t 3d-school-api .
      - name: Build web image
        run: docker build -f web/Dockerfile -t 3d-school-web .
